# Builds the review preview (noindex) with the real photographs and publishes it to GitHub Pages.
# Needs: repo Settings → Pages → Source: "GitHub Actions". Not a launch: pages are noindex.
name: Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download photographs from the existing site
        run: node scripts/fetch-assets.mjs
      - name: Build (preview: noindex, relative links)
        run: LINKS=files node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
